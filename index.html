<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>SoundWatch — Live Washington Ferries</title>
<meta name="theme-color" content="#0a1214"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet"/>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
<link rel="stylesheet" href="/styles.css"/>
</head>
<body>
<div id="app">
<div id="map"></div>
<header class="topbar">
<div class="brand">
<div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17c2-1 4.5-1.5 7-1.5h4c2.5 0 5 .5 7 1.5"/><path d="M5 14.5 6.5 9h11L19 14.5"/><path d="M9.5 9V7a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2"/></svg></div>
<div><div class="brand-name">SoundWatch</div><div class="brand-meta"><span class="live-dot" id="liveDot"></span><span id="statusText">Connecting…</span></div></div>
</div>
<button type="button" class="icon-btn" id="listToggle" aria-label="Toggle vessel list"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>
<div class="route-bar" id="routeBar"></div>
<aside class="panel" id="panel">
<div class="panel-head">
<div class="search-wrap"><input type="search" id="search" placeholder="Search boats or terminals" autocomplete="off"/></div>
<div class="tabs"><button type="button" class="tab active" data-tab="vessels">Boats</button><button type="button" class="tab" data-tab="terminals">Terminals</button></div>
</div>
<div class="panel-body" id="panelBody"></div>
</aside>
<div class="map-tools">
<button type="button" class="tool active" data-style="voyager" title="Street map">☀</button>
<button type="button" class="tool" data-style="dark" title="Dark map">☾</button>
<button type="button" class="tool" data-style="satellite" title="Satellite">◉</button>
<button type="button" class="tool" id="followBtn" title="Follow selected boat" disabled>⌖</button>
</div>
<div class="detail" id="detail" hidden></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="/app.js"></script>
</body>
</html>
